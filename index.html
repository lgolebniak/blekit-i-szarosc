<script>
'use strict';
/* ================= RDZEŃ ================= */
const W=960,H=540,TS=12,GW=80,GH=45,TAU=Math.PI*2;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const SCR=ctx;
ctx.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const R=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){const r=mulberry32(seed),P=256,v=new Float32Array(P*P);for(let i=0;i<v.length;i++)v[i]=r();
  const s=t=>t*t*(3-2*t);
  return (x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=s(x-xi),w=s(y-yi);const g=(a,b)=>v[((b&255)*P)+(a&255)];
    return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),w);};}
function fit(){const aw=innerWidth-32,ah=innerHeight;const s=Math.max(.3,Math.min(aw/W,ah/H));cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}

function MapB(seed){this.t=new Uint8Array(GW*GH);this.h=new Uint8Array(GW*GH);this.n=makeNoise(seed*13+5);}
MapB.prototype.fill=function(v){this.t.fill(v);};
MapB.prototype.each=function(x0,y0,x1,y1,fn){const a=Math.max(0,Math.floor(x0/TS)),b=Math.max(0,Math.floor(y0/TS)),c=Math.min(GW-1,Math.floor(x1/TS)),d=Math.min(GH-1,Math.floor(y1/TS));
  for(let ty=b;ty<=d;ty++)for(let tx=a;tx<=c;tx++)fn(tx,ty,tx*TS+TS/2,ty*TS+TS/2);};
MapB.prototype.circle=function(cx,cy,r,v,rough=.35){const m=r*(1+rough);this.each(cx-m,cy-m,cx+m,cy+m,(tx,ty,px,py)=>{
  const rr=r*(1+rough*(this.n(px/37+cx*.01,py/37)-.5)*2);if(Math.hypot(px-cx,py-cy)<rr)this.t[ty*GW+tx]=v;});};
MapB.prototype.rect=function(x,y,w,h,v){this.each(x,y,x+w-1,y+h-1,(tx,ty)=>{this.t[ty*GW+tx]=v;});};
MapB.prototype.path=function(pts,w,v){for(let i=0;i<pts.length-1;i++){const[ax,ay]=pts[i],[bx,by]=pts[i+1];const L=Math.hypot(bx-ax,by-ay),st=Math.ceil(L/4);
  for(let s=0;s<=st;s++){const k=s/st,x=lerp(ax,bx,k),y=lerp(ay,by,k),rr=w/2+2;this.each(x-rr,y-rr,x+rr,y+rr,(tx,ty,px,py)=>{if(Math.hypot(px-x,py-y)<=rr)this.t[ty*GW+tx]=v;});}}};
MapB.prototype.hill=function(cx,cy,r,l,rough=.3){const m=r*(1+rough);this.each(cx-m,cy-m,cx+m,cy+m,(tx,ty,px,py)=>{
  const rr=r*(1+rough*(this.n(px/45+9,py/45)-.5)*2);if(Math.hypot(px-cx,py-cy)<rr){const i=ty*GW+tx;if(this.h[i]<l)this.h[i]=l;}});};
MapB.prototype.sym=function(mode){for(let ty=0;ty<GH;ty++)for(let tx=GW/2;tx<GW;tx++){const sx=GW-1-tx,sy=mode==='rot'?GH-1-ty:ty;
  this.t[ty*GW+tx]=this.t[sy*GW+sx];this.h[ty*GW+tx]=this.h[sy*GW+sx];}};

const AU={ctx:null,master:null,noise:null,

  ok(){return this.ctx&&this.ctx.state==='running';},
  pan(x){return clamp((x/W)*2-1,-1,1)*.8;},
  burst(dur,freq,type,q,vol,pan=0,delay=0){if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay;const s=c.createBufferSource();s.buffer=this.noise;s.playbackRate.value=.8+Math.random()*.4;
    const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);let node=g;if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;g.connect(p);node=p;}node.connect(this.master);s.start(t,Math.random()*.4,dur+.05);},
  tone(f,dur,type,vol,delay=0,slide=0,lp=0){if(!this.ok())return;const c=this.ctx,t=c.currentTime+delay;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);

  for(const g of gps){if(input.slot.includes(g.index)||!padActive(g))continue;const i=input.slot.indexOf(null);if(i<0)break;

    cur.nu=cur.up||ly<-.6;cur.nd=cur.down||ly>.6;cur.nl=cur.left||lx<-.6;cur.nr=cur.right||lx>.6;

function tryVolley(u,manual){

    if(t){const tm=randAlive(t);if(!tm)break;const d=dist(m.x,m.y,tm.x,tm.y);
      const p=.33*(1-.55*Math.min(1,d/range))*coverAt(tm,m.x,m.y)*hitMods(u,t,tm)*Math.sqrt(fl);
      if(R()<p){killMan(t,tm,'shot',fl);G.stats[u.side].hits++;u.kills++;}else dustAt(tm.x+(R()-.5)*16,tm.y+(R()-.5)*6,1);}
    else dustAt(u.x+Math.cos(u.fa)*range*.7+(R()-.5)*20,u.y+Math.sin(u.fa)*range*.7+(R()-.5)*20,1);}
  if(t){t.morale-=1.5*fl;t.underFire=2.5;}
  AU.musket(u.x,k);return true;

function separate(dt){for(let i=0;i<units.length;i++){const a=units[i];if(a.dead||a.gone)continue;for(let j=i+1;j<units.length;j++){const b=units[j];
  if(b.dead||b.gone||b.side!==a.side)continue;const d=dist(a.x,a.y,b.x,b.y),lim=(SPEC[a.type].r+SPEC[b.type].r)*.75;

function playerCmds(p){const c=input.ctl[p];
  if(c.p.lb||c.p.left)cycleSel(p,-1);if(c.p.rb||c.p.right)cycleSel(p,1);
  if(c.p.up){for(const u of sideUnits(p))u.stance='adv';msg(p,'Rozkaz: cała armia – naprzód!');AU.bugle(BUG.flag);}
  if(c.p.down){for(const u of sideUnits(p)){u.stance='hold';u.hx=u.x;u.hy=u.y;}msg(p,'Rozkaz: cała armia – trzymać pozycje.');AU.ui();}
  if(c.p.b&&G.state==='battle'){const u=selUnit(p);if(u)rally(p,u.x,u.y);}
  if(c.p.start){if(G.state==='deploy'){G.ready[p]=!G.ready[p];AU.ok2();}else if(G.state==='battle'){G.state='pause';G.pauseSel=0;AU.ui();}}}
function updObjective(dt){const c=[0,0];for(const u of units)if(!u.dead&&!u.gone&&!u.rout&&dist(u.x,u.y,OBJ.x,OBJ.y)<OBJ.r+8)c[u.side]++;
  const sp=s=>dt*.28*(1+.25*(c[s]-1));
  if(c[0]&&!c[1])G.objProg=Math.max(-1,G.objProg-sp(0));else if(c[1]&&!c[0])G.objProg=Math.min(1,G.objProg+sp(1));
  if(G.objProg<=-1&&G.objOwner!==0){G.objOwner=0;msg(0,'Niebiescy zdobyli sztandar!');AU.bugle(BUG.flag);}
  if(G.objProg>=1&&G.objOwner!==1){G.objOwner=1;msg(1,'Szarzy zdobyli sztandar!');AU.bugle(BUG.flag);}
  if(G.objOwner===0&&G.objProg>0)G.objOwner=-1;if(G.objOwner===1&&G.objProg<0)G.objOwner=-1;
  if(G.objOwner>=0)G.score[G.objOwner]+=dt;}
function endBattle(w,reason){G.winner=w;G.reason=reason;G.state='end';G.endT=0;AU.bugle(BUG.win);for(let p=0;p<2;p++)if(humanOf(p)>=0)rumble(p,.4,.6,500);}
function checkVictory(dt){const act=[0,0],alive=[0,0];for(const u of units)if(!u.dead&&!u.gone){alive[u.side]++;if(!u.rout)act[u.side]++;}
  const lose=[0,0];for(let s=0;s<2;s++){if(act[s]===0&&alive[s]>0)G.routAll[s]+=dt;else G.routAll[s]=0;lose[s]=alive[s]===0||G.routAll[s]>8;}
  if(lose[0]&&lose[1])return endBattle(-1,'Obie armie rozbite');
  if(lose[0])return endBattle(1,'Armia Niebieskich rozbita');if(lose[1])return endBattle(0,'Armia Szarych rozbita');
  if(G.score[0]>=WINSCORE)return endBattle(0,'Sztandar utrzymany do końca');if(G.score[1]>=WINSCORE)return endBattle(1,'Sztandar utrzymany do końca');}
function cpuCommander(){if(G.mode!=='cpu'||G.rallyCd[1]>0)return;const r=units.find(u=>u.side===1&&u.rout&&!u.dead&&!u.gone&&u.x<W-60);if(r)rally(1,r.x,r.y);}
function beginBattle(){G.state='battle';AU.bugle(BUG.charge);msg(0,'Do boju!');for(const u of units){u.hx=u.x;u.hy=u.y;}}
function stepBattle(dt){
  G.t+=dt;
  for(let p=0;p<2;p++)if(humanOf(p)>=0)playerCmds(p);
  if(G.state!=='battle'&&G.state!=='deploy')return;
  for(const u of units)updUnit(u,dt);
  separate(dt);fixSel();
  if(G.state==='battle'){updMelee(dt);updProjs(dt);updObjective(dt);G.rallyCd[0]=Math.max(0,G.rallyCd[0]-dt);G.rallyCd[1]=Math.max(0,G.rallyCd[1]-dt);cpuCommander();checkVictory(dt);}
  else if(G.state==='deploy'){G.deployT-=dt;if(G.deployT<=0||(G.ready[0]&&G.ready[1]))beginBattle();}
}

function infSlots(u,n){const cd=u.colDir||clDir(u.side),o=[];for(let j=0;j<n;j++){const c=j-(n-1)/2;o.push([lerp((j%2)*8-4,-cd*c*9,u.s),lerp(c*11,((j%2)-.5)*6,u.s)]);}return o;}

  if(u.lance&&u.state==='ride'){for(let j=0;j<n;j++){const c=j-(n-1)/2;
      if(u.form==='line')o.push([0,c*15]);else if(u.form==='wedge'){const r=Math.ceil(j/2),sd=j%2?-1:1;o.push([-dir*r*13,j?sd*r*13:0]);}else o.push([-dir*c*16,0]);}return o;}
  for(let j=0;j<n;j++){const c=j-(n-1)/2;o.push([lerp((j%2)*4-2,-dir*c*16,u.s),lerp(c*15,0,u.s)]);}return o;}

    if(snap){m.x=tx;m.y=ty;continue;}const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy);
    if(d>.4){const st=Math.min(d,40*dt);m.x+=dx/d*st;m.y+=dy/d*st;m.anim+=st*.22;m.mv=1;}else m.mv=Math.max(0,m.mv-dt*5);}}

/* ================= RZYM: zachowania ================= */
BEH.leg=function(u,dt,I){const{x,y}=I,sp={line:22,testudo:11,wedge:28,orbis:0}[u.rf]*(u.formT>0?.5:1)*(G.weather==='rain'?.9:1);
  if(u.rf==='line'){const horiz=Math.abs(x)>.3&&Math.abs(x)>=Math.abs(y),vert=Math.abs(y)>.3&&Math.abs(y)>Math.abs(x);
    if(horiz){u.s=Math.min(1,u.s+dt*.7);u.colDir=Math.sign(x);}else if(vert)u.s=Math.max(0,u.s-dt*1.1);
    clMoveMen(u,x*sp,y*sp,dt,false,vert?2.2:horiz?1.2:0,I.hum);}
  else{u.s=Math.max(0,u.s-dt*2);clMoveMen(u,x*sp,y*sp,dt,false,2.6,I.hum);}
  if(I.Ap){const o=['line','testudo','wedge','orbis'];u.rf=o[(o.indexOf(u.rf)+1)%4];u.formT=.8;AU.ui();}
  if(I.Rp&&I.bat){if(u.cd2>0||u.rf==='testudo'||u.rf==='orbis'){if(I.hum)AU.bad();}
    else{const sv=u.reload;u.reload=0;clVolley(u,{reload:.01,range:95,spd:170,pk:.7,kind:'pilum',noPowder:true});u.reload=sv;u.cd2=5;}}};
BEH.arc=function(u,dt,I){const{x,y,A}=I;
  if(!u.aiming){const sp=24*(G.weather==='rain'?.9:1),horiz=Math.abs(x)>.3&&Math.abs(x)>=Math.abs(y),vert=Math.abs(y)>.3&&Math.abs(y)>Math.abs(x);
    if(horiz){u.s=Math.min(1,u.s+dt*.7);u.colDir=Math.sign(x);}else if(vert)u.s=Math.max(0,u.s-dt*1.1);
    clMoveMen(u,x*sp,y*sp,dt,false,vert?2.2:horiz?1.2:0,I.hum);}
  else clMoveMen(u,0,0,dt,false,0,I.hum);
  if(!I.bat)return;
  if(A&&u.reload<=0){if(!u.aiming){u.aiming=true;u.aimDir=1;u.aimR=u.aimMin;}u.aimR+=u.aimDir*260*dt;if(u.aimR>u.aimMax){u.aimR=u.aimMax;u.aimDir=-1;}if(u.aimR<u.aimMin){u.aimR=u.aimMin;u.aimDir=1;}}
  else if(u.aiming){u.aiming=false;arrowVolley(u);}
  else if(I.Ap&&I.hum)AU.bad();};
function arrowVolley(u){const dir=clDir(u.side),kind=u.ammoKind||'arrow';u.reload=u.reloadMax||3;u.firedT=3;let k=0;
  for(const m of u.men){if(!m.alive)continue;k++;const rr=u.aimR*(1+(R()-.5)*.1);
    projs.push({kind,x:m.x,y:m.y,sx:m.x+dir*4,sy:m.y,tx:m.x+dir*rr,ty:m.y+(R()-.5)*12,t:0,T:.45+rr/520+R()*.1,H:rr*(kind==='sling'?.12:.28),h:0,a:u.fa,bounce:0,side:u.side,src:u.key,hit:new Set(),low:false});}
  G.stats[u.side].shots+=k;AU.burst(.25,2600,'highpass',1,.16,AU.pan(u.x));}
function arrowImpact(p){let hit=false;
  for(const e of units){if(e.dead||e.gone||e.type==='tank'||dist(p.tx,p.ty,e.x,e.y)>60)continue;
    for(const m of e.men){if(!m.alive||dist(p.tx,p.ty,m.x,m.y)>(e.type==='ele'?10:5))continue;hit=true;
      let pr=(p.kind==='sling'?.5:.6)*Math.min(1,TCOVER[tAt(m.x,m.y)]);if(e.key==='leg')pr*=e.rf==='testudo'?.06:e.rf==='orbis'?.4:1;
      pr*=eff(p.src,e.key);if(R()<pr){killMan(e,m,'shot');if(e.side!==p.side)G.stats[p.side].hits++;}break;}if(hit)break;}
  if(!hit&&G.tctx&&tAt(p.tx,p.ty)!==T.WATER){const g=G.tctx;g.fillStyle='#5a4028';g.fillRect(Math.round(p.tx),Math.round(p.ty)-3,1,3);g.fillStyle='#e8e2d0';g.fillRect(Math.round(p.tx),Math.round(p.ty)-4,1,1);}}
function artVert(u,y,dt){if(Math.abs(y)>.2){const ny=clamp(u.y+y*CLS.art.spd*Math.max(.3,passF('art',u.x,u.y))*dt,32,H-10);if(passF('art',u.x,ny)>0)u.y=ny;u.setup=.3;}}
BEH.bal=function(u,dt,I){artVert(u,I.y,dt);
  if(I.Ap&&I.bat){if(u.reload>0||u.setup>0){if(I.hum)AU.bad();}
    else if(useShot(u)){const dir=clDir(u.side);u.reload=3.5*(hAt(u.x,u.y)>0?.8:1);u.firedT=3;u.recoil=1;u.shotT=.3;
      bullets.push({x:u.x+dir*12,y:u.y,vx:dir*430,vy:0,left:820,side:u.side,src:u.key,kind:'bolt',pk:.85,pierce:3});
      AU.burst(.3,900,'bandpass',2,.35,AU.pan(u.x));AU.tone(150,.15,'square',.07);G.stats[u.side].shots++;}}
  clCrew(u,false,dt);};

// celowanie w stożku ±45°: krótkie A = strzał na wprost, przytrzymane A = drążek góra–dół ustawia skos, puszczenie = strzał
const CONE=Math.PI/4,CONE_HOLD=.22;
const coneVec=(u,a)=>[clDir(u.side)*Math.cos(a),Math.sin(a)];
function coneFire(u,I,dt){if(!I.bat||!I.inp){u.aHold=0;u.coneOn=false;return null;}
  if(I.A){u.aHold=(u.aHold||0)+dt;if(u.aHold>CONE_HOLD){if(!u.coneOn){u.coneOn=true;u.aimA=0;}u.aimA=clamp(u.aimA+I.y*1.4*dt,-CONE,CONE);}return null;}
  if(!u.aHold)return null;const a=u.coneOn?u.aimA:0;u.aHold=0;u.coneOn=false;return a;}
function coneLines(u,S){ctx.save();ctx.strokeStyle=S.ui;ctx.lineWidth=1;
  const ray=(x,y,a,L,al)=>{const[vx,vy]=coneVec(u,a);ctx.globalAlpha=al;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+vx*L,y+vy*L);ctx.stroke();};
  if(u.type==='tank'){const L=u.tAim===3?u.aimR:u.aimMax;ray(u.x,u.y,-CONE,70,.3);ray(u.x,u.y,CONE,70,.3);ctx.setLineDash([3,3]);ray(u.x,u.y,u.aimA,L,.85);
    if(u.tAim===3){const[vx,vy]=coneVec(u,u.aimA);ctx.setLineDash([]);ctx.beginPath();ctx.arc(u.x+vx*L,u.y+vy*L,9,0,TAU);ctx.stroke();}}
  else{ctx.setLineDash([2,3]);if(u.type==='art')ray(u.x,u.y,u.aimA,320,.6);else for(const m of u.men)if(m.alive)ray(m.x,m.y,u.aimA,u.key==='ppk'?300:230,.4);}
  ctx.restore();}
BEH.rif=function(u,dt,I){const{x,y}=I,sp=26*(G.weather==='rain'?.9:1)*(u.supT>0?.4:1),a=coneFire(u,I,dt);
  if(I.A&&I.bat)clMoveMen(u,0,0,dt,false,1,I.hum);
  else{const horiz=Math.abs(x)>.3&&Math.abs(x)>=Math.abs(y),vert=Math.abs(y)>.3&&Math.abs(y)>Math.abs(x);
    if(horiz){u.s=Math.min(1,u.s+dt*.7);u.colDir=Math.sign(x);}else if(vert)u.s=Math.max(0,u.s-dt*1.1);
    clMoveMen(u,x*sp,y*sp,dt,false,vert?2.2:horiz?1.2:0,I.hum);}
  if(a!==null&&!clVolley(u,{reload:1.7,range:230,spd:420,pk:.7,kind:'rifle',ang:a})&&I.hum)AU.bad();
  if(I.Rp&&I.bat){if(u.cd2>0){if(I.hum)AU.bad();}else{const dir=clDir(u.side);u.cd2=6;
    projs.push({kind:'gren',x:u.x,y:u.y,sx:u.x+dir*5,sy:u.y,tx:u.x+dir*(70+R()*12),ty:u.y+(R()-.5)*10,t:0,T:.75,H:24,h:0,a:u.fa,bounce:0,side:u.side,src:u.key,hit:new Set(),low:false});}}};
BEH.mg=function(u,dt,I){const{x,y,A}=I;if(u.over&&u.heat<.35)u.over=false;
  const firing=A&&I.bat&&!u.over;u.firing=firing;if(!firing)u.heat=Math.max(0,(u.heat||0)-dt*.22);
  if(!firing){const sp=15*(u.supT>0?.4:1);clMoveMen(u,x*sp,y*sp,dt,false,2,I.hum);u.mgY*=Math.pow(.25,dt);}
  else{clMoveMen(u,0,0,dt,false,1,I.hum);u.mgY=clamp((u.mgY||0)+y*240*dt,-380,380);u.heat+=dt*.28;
    if(u.heat>=1){u.over=true;msg(u.side,`${unitName(u)}: lufa przegrzana!`);}
    u.mgT=(u.mgT||0)-dt;if(u.mgT<=0){u.mgT=.085;const g=u.men.find(m=>m.alive),dir=clDir(u.side);
      if(g){const L=380,sp=380,a=Math.atan2(u.mgY,L);bullets.push({x:g.x+dir*9,y:g.y,vx:dir*sp*Math.cos(a),vy:sp*Math.sin(a)+(R()-.5)*10,left:L,side:u.side,src:u.key,kind:'mg',pk:.3,sup:true});
        parts.push({k:'flash',x:g.x+dir*10,y:g.y-3,life:0,max:.04});if(R()<.5)AU.burst(.06,1900,'bandpass',1,.13,AU.pan(u.x));if(R()<.25)addSmoke(g.x+dir*9,g.y-3,1,false);G.stats[u.side].shots++;u.firedT=3;}}}};
BEH.at=function(u,dt,I){const a=coneFire(u,I,dt);if(!(I.A&&I.bat))artVert(u,I.y,dt);
  if(a!==null){if(u.reload>0||u.setup>0){if(I.hum)AU.bad();}
    else if(useShot(u)){const[cx,cy]=coneVec(u,a),bx=u.x+cx*14;u.reload=2.6;u.firedT=3;u.recoil=1;
      const b={x:bx,y:u.y+cy*14,vx:cx*520,vy:cy*520,left:820,side:u.side,src:u.key,kind:'shell',pk:.6,boom:7,bk:.6};b.ap=bb=>{const tr=820-bb.left;return tr<300?.75:tr<550?.45:.25;};bullets.push(b);
      parts.push({k:'flash',x:bx,y:u.y-6,life:0,max:.08,big:1});addSmoke(bx,u.y-6,2,false);AU.cannon(u.x);G.shake=Math.max(G.shake,1.2);G.stats[u.side].shots++;}}

function nearBroken(x,y){if(!MAP.broken)return false;const tx=Math.floor(x/TS),ty=Math.floor(y/TS);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(MAP.broken.has((ty+dy)*GW+tx+dx))return true;return false;}

/* --- wybuchy, pancerz, dym --- */
function blast(x,y,Rr,k,side,src){for(let i=0;i<10;i++)parts.push({k:'dirt',x,y,z:0,vx:(R()-.5)*50,vy:(R()-.5)*30,vz:50+R()*60,life:0,max:.8,c:R()<.5?'#5a4630':'#7a6446'});
  parts.push({k:'flash',x,y:y-4,life:0,max:.1,big:1});addSmoke(x,y-3,2,false);const t=tAt(x,y);if(t!==T.WATER&&t!==T.BRIDGE&&t!==T.FORD&&Rr>=10)decalCrater(x,y);AU.impact(x);
  for(const e of units){if(e.dead||e.gone||e.type==='tank'||dist(x,y,e.x,e.y)>Rr+50)continue;
    for(const m of e.men){if(!m.alive)continue;const d=dist(x,y,m.x,m.y);if(d<Rr&&R()<k*(1-.4*d/Rr)*eff(src,e.key)){killMan(e,m,'ball');if(side>=0&&e.side!==side)G.stats[side].hits++;}}}
  for(let dy=-Rr;dy<=Rr;dy+=TS)for(let dx=-Rr;dx<=Rr;dx+=TS)if(tAt(x+dx,y+dy)===T.WIRE)crushWire(x+dx,y+dy);
  areaObstacleHit(x,y,Math.max(Rr,10),8);}
function grenImpact(p){blast(p.tx,p.ty,14,.75,p.side,p.src);
  for(const e of units){if(e.type!=='tank'||e.dead||e.gone)continue;if(dist(p.tx,p.ty,e.x,e.y)<14&&!e.track&&R()<.6){e.track=true;msg(e.side,`${unitName(e)}: granat zerwał gąsienicę!`);}}}
function smokeCloud(x,y){for(let i=0;i<24;i++)parts.push({k:'smoke',x:x+(R()-.5)*40,y:y+(R()-.5)*30,vx:G.wind.x*4+(R()-.5)*3,vy:G.wind.y*4+(R()-.5)*3,r:6+R()*5,g:6,life:0,max:9+R()*3,a:.7});

/* ================= 1939: ROZSTAWIENIE, SAMOOBRONA, NISZCZENIE PRZESZKÓD ================= */
const AUTO_RANGE=.75;
// --- rozstawienie przed bitwą ---
function inZone(side,x){return side===0?x<=DEPLOY:x>=W-DEPLOY;}
function deployMove(u,dx,dy){const ty=u.type,single=ty==='art'||ty==='tank'||ty==='ele';
  const pts=single?[[u.x,u.y]]:u.men.filter(m=>m.alive).map(m=>[m.x,m.y]);
  const ok=pts.every(([x,y])=>{const nx=x+dx,ny=y+dy;return inZone(u.side,nx)&&nx>6&&ny>34&&ny<H-10&&tAt(nx,ny)!==T.WATER&&passF(ty,nx,ny)>0;});
  if(!ok)return false;
  if(single){u.x+=dx;u.y+=dy;clCrew(u,true,0);}
  else{for(const m of u.men)if(m.alive){m.x+=dx;m.y+=dy;m.anim+=Math.hypot(dx,dy)*.22;m.mv=1;}clCentroid(u);}
  u.tx=u.x;u.ty=u.y;return true;}
function deployStep(dt){G.deployT-=dt;
  for(let p=0;p<2;p++){if(humanOf(p)<0)continue;const u=clSel(p);if(!u)continue;const c=input.ctl[p],sp=70*dt;
    if(Math.abs(c.lx)>.2||Math.abs(c.ly)>.2){if(!deployMove(u,c.lx*sp,c.ly*sp)){deployMove(u,c.lx*sp,0);deployMove(u,0,c.ly*sp);}}
    if(u.type==='tank'&&(c.p.rt||c.b.rt))u.hd=angDiff(0,(u.hd||0)+dt*2.2);}
  for(const u of units)for(const m of u.men)m.mv=Math.max(0,(m.mv||0)-dt*5);
  if(G.deployT<=0||(G.ready[0]&&G.ready[1])){G.state='battle';AU.bugle(BUG.charge);msg(0,'Do boju!');}}
function snapDeploy(){for(const u of units){if(u.state!=='enter')continue;
  if(u.type==='art'||u.type==='tank'||u.type==='ele'){u.x=u.tx;u.y=u.ty;clCrew(u,true,0);}
  else{for(const m of u.men)if(m.alive){m.x=u.tx+m.ox;m.y=u.ty+m.oy;m.mv=0;}clCentroid(u);}
  u.state=u.type==='cav'?'idle':'ready';}}

function nearestAlignedMan(u,shooters,rg,filter,tol){const dir=clDir(u.side);
  for(const e of units){if(e.side===u.side||e.dead||e.gone||e.state==='enter'||(filter&&!filter(e)))continue;if(Math.abs(e.x-u.x)>rg+60)continue;
    for(const m of shooters){for(const o of e.men){if(!o.alive)continue;const dx=(o.x-m.x)*dir;if(dx>4&&dx<rg&&Math.abs(o.y-m.y)<tol)return[e,o,m];}}}return null;}
const AUTO={
  rif(u,dt){if(u.reload>0)return;const rg=230*AUTO_RANGE,al=u.men.filter(m=>m.alive);
    if(nearestAlignedMan(u,al,rg,e=>e.type!=='tank',3.5))clVolley(u,{reload:1.7,range:rg,spd:420,pk:.7,kind:'rifle'});},
  ppk(u,dt){if(u.reload>0)return;const g=u.men.find(m=>m.alive);if(!g)return;const rg=420*AUTO_RANGE,dir=clDir(u.side);
    for(const e of units){if(e.side===u.side||e.dead||e.gone||e.type!=='tank')continue;const dx=(e.x-g.x)*dir;
      if(dx>4&&dx<rg&&Math.abs(e.y-g.y)<5){u.reload=3;u.firedT=3;const b={x:g.x+dir*8,y:g.y,vx:dir*700,vy:0,left:rg,side:u.side,src:u.key,kind:'atr',pk:.75};b.ap=bb=>{const tr=rg-bb.left;return tr<150?.3:.15;};
        bullets.push(b);parts.push({k:'flash',x:g.x+dir*10,y:g.y-3,life:0,max:.06});AU.musket(u.x,2);G.stats[u.side].shots++;return;}}},
  mg(u,dt){if(u.over){u.firing=false;return;}const g=u.men.find(m=>m.alive);if(!g)return;const rg=380*AUTO_RANGE,dir=clDir(u.side);let best=null,bd=1e9;
    for(const e of units){if(e.side===u.side||e.dead||e.gone||e.type!=='inf'||e.state==='enter')continue;for(const o of e.men){if(!o.alive)continue;const dx=(o.x-g.x)*dir;
      if(dx>20&&dx<rg&&Math.abs(o.y-g.y)<=dx){const d=dx+Math.abs(o.y-g.y)*2;if(d<bd){bd=d;best=o;}}}}
    if(!best){u.firing=false;return;}u.firing=true;const dx=Math.max(40,(best.x-g.x)*dir),want=(best.y-g.y)*380/dx;u.mgY+=clamp(want-(u.mgY||0),-90*dt,90*dt);
    u.heat=(u.heat||0)+dt*.5;if(u.heat>=1){u.over=true;u.firing=false;return;}
    u.mgT=(u.mgT||0)-dt;if(u.mgT<=0){u.mgT=.1;bullets.push({x:g.x+dir*9,y:g.y,vx:dir*380,vy:u.mgY+(R()-.5)*10,left:rg,side:u.side,src:u.key,kind:'mg',pk:.3,sup:true});
      parts.push({k:'flash',x:g.x+dir*10,y:g.y-3,life:0,max:.04});if(R()<.5)AU.burst(.06,1900,'bandpass',1,.12,AU.pan(u.x));G.stats[u.side].shots++;u.firedT=3;}},
  tank(u,dt){const c=Math.cos(u.hd||0),s=Math.sin(u.hd||0);
    for(const e of units){if(e.side===u.side||e.dead||e.gone||e.state==='enter')continue;const d=dist(u.x,u.y,e.x,e.y),da=Math.abs(angDiff(u.hd||0,Math.atan2(e.y-u.y,e.x-u.x)));
      if(u.reload<=0&&d<760*AUTO_RANGE&&da<.06){u.reload=3.2;u.firedT=3;u.recoil=1;const bx=u.x+c*18,by=u.y+s*10;
        bullets.push({x:bx,y:by,vx:c*480,vy:s*480,left:760*AUTO_RANGE,side:u.side,src:u.key,kind:'shell',pk:.6,boom:10,bk:.75,ap:.35});
        parts.push({k:'flash',x:bx,y:by-12,life:0,max:.1,big:1});addSmoke(bx,by-12,3,true);AU.cannon(u.x);G.stats[u.side].shots++;}
      if(e.type==='inf'&&d<320*AUTO_RANGE&&da<.2){u.mgT=(u.mgT||0)-dt;if(u.mgT<=0){u.mgT=.14;bullets.push({x:u.x+c*12,y:u.y+s*6,vx:c*360,vy:s*360+(R()-.5)*18,left:320*AUTO_RANGE,side:u.side,src:u.key,kind:'mg',pk:.25,sup:true});
        if(R()<.5)AU.burst(.05,1900,'bandpass',1,.1,AU.pan(u.x));}}}}
};

const OBST_HP={[T.SANDBAG]:12,[T.RUINS]:18,[T.HOUSE]:30,[T.WALL]:16};

function obstacleHit(x,y,dmg){if(G.era!=='ww2')return;const tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(tx<0||ty<0||tx>=GW||ty>=GH)return;

  const before=MAP.thp[i];MAP.thp[i]+=dmg;const g=G.tctx,X=tx*TS,Y=ty*TS;

      else{g.fillStyle='rgba(70,82,44,.9)';g.fillRect(X,Y,TS,TS);for(let k=0;k<7;k++){g.fillStyle=t===T.SANDBAG?(R()<.5?'#b8a67a':'#8a7a52'):(R()<.5?'#8a847a':'#6a645a');g.fillRect(X+Math.floor(R()*10),Y+Math.floor(R()*10),2+Math.floor(R()*2),1+Math.floor(R()*2));}}}}}

const UCLASS={inf:'inf',cav:'cav',lan:'lan',art:'art',

const BEATS={
  cav:['inf'],inf:['art'],art:['lan'],lan:['cav'],
  heavy:['rcav','missile'],rcav:['missile','flat'],missile:['flat','arcm','beast'],flat:['arcm','heavy','beast'],arcm:['heavy','rcav'],beast:['heavy','rcav'],
  rif:['at','mor'],mg:['rif','ppk'],ppk:['tank','mor'],tank:['rif','mg'],at:['ppk','tank'],mor:['mg','at']};
const EFF_UP=1.35,EFF_DN=1/1.35;
function eff(a,b){if(!a||!b||G.rules!=='classic')return 1;const ca=UCLASS[a],cb=UCLASS[b];if(!ca||!cb||ca===cb)return 1;
  if((BEATS[ca]||[]).includes(cb))return EFF_UP;if((BEATS[cb]||[]).includes(ca))return EFF_DN;return 1;}

function evade(e,m){if(G.rules!=='classic')return 1;
  if(e.type==='cav'){if(e.gallop)return .55;if(e.state==='ride')return .75;return m&&m.mv>.2?.85:1;}
  if(e.type==='tank'||e.type==='ele')return e.moving?.85:1;
  return m&&m.mv>.2?.85:1;}

const _clStrike=clStrike;
clStrike=function(a,b,m,o,d){return _clStrike(a,b,m,o,d)*eff(a.key,b.key);};

  const vx=(u.x-u.px)/dt,vy=(u.y-u.py)/dt;u.vx=lerp(u.vx||0,clamp(vx,-120,120),.15);u.vy=lerp(u.vy||0,clamp(vy,-120,120),.15);u.px=u.x;u.py=u.y;}}

// piechota z muszkietami: jak w wojnie secesyjnej, parametry salwy z tabeli jednostek
BEH.musk=function(u,dt,I){const kd=kdOf(u),sp=(kd.spd||22)*(G.weather==='rain'?.9:1),{x,y}=I;
  const horiz=Math.abs(x)>.3&&Math.abs(x)>=Math.abs(y),vert=Math.abs(y)>.3&&Math.abs(y)>Math.abs(x);
  if(horiz){u.s=Math.min(1,u.s+dt*.7);u.colDir=Math.sign(x);}else if(vert)u.s=Math.max(0,u.s-dt*1.1);
  clMoveMen(u,x*sp,y*sp,dt,false,vert?2.2:horiz?1.2:0,I.hum);
  if(I.Ap&&I.bat&&!clVolley(u,kd.vol)&&I.hum)AU.bad();};
// rajtaria: ruch w każdą stronę, salwa z pistoletów z bliska
BEH.skirm=function(u,dt,I){const kd=kdOf(u),sp=kd.spd||44;clMoveMen(u,I.x*sp,I.y*sp,dt,false,2,I.hum);u.charging=false;u.gallop=false;
  if(I.Ap&&I.bat&&!clVolley(u,kd.vol)&&I.hum)AU.bad();};
// husaria: stępa (każdy kierunek) → szarża z kopiami → koncerz; zwrot drążkiem w tył; po przejeździe przez pole wraca z nowymi kopiami
BEH.hus=function(u,dt,I){const{x,y,dir}=I;
  if(u.state==='idle'){u.charging=false;u.gallop=false;u.s=Math.max(0,u.s-dt*1.2);
    clMoveMen(u,x*CLS.hus.walk,y*CLS.hus.walk,dt,false,2,I.hum);
    const al=u.men.filter(m=>m.alive),need=al.some(m=>!m.kopia),still=!al.some(m=>m.mv>.2);
    if(need&&still&&inZone(u.side,u.x)){u.armT=(u.armT||0)+dt;if(u.armT>3){u.armT=0;for(const m of al)m.kopia=true;msg(u.side,`${unitName(u)}: nowe kopie z taboru!`);AU.ui();}}else u.armT=0;
    if(I.bat&&I.Ap){u.state='ride';u.form='line';u.charging=true;u.gallop=true;AU.bugle(BUG.charge);msg(u.side,`${unitName(u)}: husaria – szarża!`);}}
  else if(u.state==='halt'){u.charging=false;u.gallop=false;clMoveMen(u,0,0,dt,false,1.5,I.hum);if(u.rearT<=0)u.state='idle';}
  else{u.gallop=true;u.charging=true;
    if(I.inp&&x*dir<-.5&&!u.men.some(m=>m.alive&&m.wrap)){u.state='halt';u.rearT=.6;u.gallop=false;u.charging=false;AU.tone(700,.35,'sawtooth',.05,0,-300,1400);return;}
    if(I.Rp){u.form=u.form==='line'?'wedge':'line';AU.ui();}
    const ay=I.inp?y:cavAvoid(u)*.8;
    clMoveMen(u,dir*CLS.hus.sprint,ay*CLS.cav.steer,dt,true,2.2,I.hum,!I.inp);
    if(R()<.8)dustAt(u.x-dir*10+(R()-.5)*16,u.y+(R()-.5)*30,1,'140,120,85');
    let all=true;for(const m of u.men){if(!m.alive)continue;if(!m.wrap&&(m.x<-12||m.x>W+12))m.wrap=true;if(!m.wrap)all=false;}
    if(all){clReenter(u);return;}
    if(I.Ap&&u.slashCd<=0){u.slashT=.4;u.slashCd=.55;AU.clash(u.x);}}};
// po przejeździe przez całe pole husaria bierze nowe kopie
const _clReenterPL=clReenter;
clReenter=function(u){_clReenterPL(u);if(u.key==='hus'){for(const m of u.men)if(m.alive)m.kopia=true;msg(u.side,`${unitName(u)}: nowe kopie – można szarżować znowu!`);}};
function lanceSplinter(m,side){const dir=clDir(side);for(let i=0;i<6;i++)parts.push({k:'dirt',x:m.x+dir*14,y:m.y,z:12,vx:dir*(10+R()*40),vy:(R()-.5)*30,vz:30+R()*50,life:0,max:.7,c:R()<.5?'#d8c088':'#a83a2a'});
  AU.burst(.12,2600,'highpass',2,.25,AU.pan(m.x));}

/* --- walka wręcz XVII w.: kopia dłuższa od piki, jeż pikinierów, zbroja husarii --- */
function pl17Strike(a,b,m,o,d){let p;const kd=kdOf(a),front=(o.x-m.x)*clDir(a.side)>-2;
  if(a.key==='hus'){if(a.state==='ride'&&a.gallop&&m.kopia&&front)p=.7;else if(a.slashT>0)p=b.type==='cav'?.32:.48;else p=a.state==='ride'&&a.gallop&&b.type!=='cav'&&d<7?.08:.02;}
  else if(a.type==='cav'){if(kd.beh==='skirm')p=.03;else if(a.slashT>0)p=b.type==='cav'?(b.slashT>0?.22:.4):.45;else if(a.gallop&&b.type!=='cav'&&d<6)p=.07;else p=.01;}
  else if(a.key==='pik')p=a.rf==='phalanx'?.06*(b.type==='cav'?2.6:1):.045*(b.type==='cav'?1.6:1);
  else if(a.type==='inf')p=(b.type==='cav'?.035:b.type==='art'?.06:.025)*(kd.melee||1);
  else p=.01;
  if(b.key==='pik'){const fr=isFront(b,m.x);if(b.rf==='phalanx'&&fr)p*=a.key==='hus'&&m.kopia?.4:a.type==='cav'?.2:.5;else if(!fr)p*=1.25;else if(a.key==='hus')p*=1.15;}
  if(b.key==='hus')p*=.8;
  if(a.formT>0)p*=.6;
  return p;}
const _clStrikePL=clStrike;
clStrike=function(a,b,m,o,d){return G.era==='pl17'?pl17Strike(a,b,m,o,d)*eff(a.key,b.key):_clStrikePL(a,b,m,o,d);};
// walka wręcz: zasięg zależny od broni (kopia 17, pika 10–13) i pękanie kopii
clMelee=function(dt){clMeleeT-=dt;if(clMeleeT>0)return;clMeleeT=.1;
  const L=units.filter(u=>!u.dead&&!u.gone&&u.state!=='enter');
  for(const u of L)for(const m of u.men)if(m.cool>0)m.cool-=.1;
  for(const a of L)for(const b of L){if(a.side===b.side||Math.abs(a.x-b.x)>100||Math.abs(a.y-b.y)>100)continue;
    const base=a.type==='cav'?(a.lance?13:11):a.type==='tank'?9:a.type==='ele'?10:7;
    for(const m of a.men){if(!m.alive||m.cool>0)continue;const kop=a.key==='hus'&&m.kopia&&a.state==='ride'&&a.gallop;
      const reach=kop?17:a.key==='pik'?(a.rf==='phalanx'?13:10):base;
      for(const o of b.men){if(!o.alive)continue;const d=dist(m.x,m.y,o.x,o.y);if(d>reach)continue;
        const p=clStrike(a,b,m,o,d);if(p<=0)continue;const hit=R()<p;
        if(kop&&(o.x-m.x)*clDir(a.side)>-2&&(hit||R()<.25)){m.kopia=false;lanceSplinter(m,a.side);}
        if(!hit)continue;
        const kind=(a.type==='cav'&&a.slashT<=0&&!a.lance)||a.type==='tank'?'trample':'melee';killMan(b,o,kind);m.cool=a.type==='tank'?.1:.35;
        parts.push({k:'spark',x:(m.x+o.x)/2,y:(m.y+o.y)/2-8,vx:(R()-.5)*30,vy:-20,life:0,max:.25});if(R()<.5&&a.type!=='tank')AU.clash(m.x);break;}}}};
// zbroja husarza: kule trafiają rzadziej
const _evadePL=evade;evade=function(e,m){const v=_evadePL(e,m);return e.key==='hus'?v*.8:v;};

  // szumy spółgłosek (jeden szum na cały oddział)
  cons(c,t0,syl,o,rate,out){let t=t0;const src=c.createBufferSource();src.buffer=AU.noise;src.loop=true;const f=c.createBiquadFilter(),g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(out);
    const hit=(key,at)=>{const C=CONS[key];if(!C)return;f.type=C[1];f.frequency.setValueAtTime(C[0],at);f.Q.setValueAtTime(C[2],at);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(C[4]*.9,at+.008);g.gain.setTargetAtTime(0,at+C[3]*.6,C[3]*.3);};
    for(const s of syl){const d=s.d*rate;if(s.c)hit(s.c,t-.02);if(s.tail){const k=CONS[s.tail.slice(0,2)]?s.tail.slice(0,2):s.tail.slice(-1);hit(k,t+d*.8);}t+=d;}
    src.start(t0);src.stop(t+.3);},
  // oddech krzyku: szum przez formant samogłoski
  breath(c,t0,syl,rate,out,end){const src=c.createBufferSource();src.buffer=AU.noise;src.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=3;const g=c.createGain();g.gain.value=0;
    src.connect(f);f.connect(g);g.connect(out);let t=t0;for(const s of syl){const V=VOW[s.v]||VOW.a;f.frequency.setTargetAtTime(V[1],t,.03);g.gain.setTargetAtTime(.22,t+.02,.03);t+=s.d*rate;}
    g.gain.setTargetAtTime(0,end,.1);src.start(t0);src.stop(end+.6);},
  // krzyk rannego
  scream(x){if(!AU.ok()||G.vox<1)return;const now=performance.now();if(now-this.lastScream<520)return;this.lastScream=now;
    const v=['a','o','u','e'][Math.floor(R()*4)],h=R()<.5?'h':'';this.sing(`${h}${v}${v}/0/${(.25+R()*.3).toFixed(2)}`,{x,n:1,base:170+R()*120,shout:true,vol:.28});},
  // rżenie konia
  neigh(x,vol=.22){if(!AU.ok())return;const c=AU.ctx,t=c.currentTime;const o=c.createOscillator();o.type='sawtooth';const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=2;
    const am=c.createOscillator();am.frequency.value=13+R()*5;const ag=c.createGain();ag.gain.value=180;am.connect(ag);ag.connect(o.frequency);
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.05);g.gain.setTargetAtTime(0,t+.75,.15);
    o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(1250,t+.18);o.frequency.linearRampToValueAtTime(950,t+.5);o.frequency.linearRampToValueAtTime(520,t+1);
    let n=g;if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=AU.pan(x);g.connect(p);n=p;}o.connect(f);f.connect(g);n.connect(AU.master);o.start(t);am.start(t);o.stop(t+1.3);am.stop(t+1.3);}
};
/* --- lektor: synteza mowy przeglądarki (jeśli są głosy w systemie) --- */
const TTS={ok:typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined',voices:[],
  load(){if(!this.ok)return;try{this.voices=speechSynthesis.getVoices()||[];}catch(e){this.ok=false;}},
  pick(lang){const L=lang.slice(0,2),vs=this.voices.filter(v=>(v.lang||'').toLowerCase().startsWith(L));
    return vs.find(v=>/male|mężczyzna|adam|krzysztof|jacek|marek|david|guy|mark|stefan|conrad|ahmet|tolga|dmitri|pavel|mattias/i.test(v.name)&&!/female/i.test(v.name))||vs[0]||null;},
  say(text,lang,o={}){if(!this.ok||G.vox<2||!AU.ok())return;try{if(speechSynthesis.speaking&&!o.prio)return;if(o.prio)speechSynthesis.cancel();
    if(!this.voices.length)this.load();let v=this.pick(lang),l=lang;if(!v){v=this.pick('pl');l='pl-PL';}
    const u=new SpeechSynthesisUtterance(text);u.lang=l;if(v)u.voice=v;u.pitch=o.pitch||.7;u.rate=o.rate||1.05;u.volume=o.vol||1;speechSynthesis.speak(u);}catch(e){}}};
TTS.load();if(TTS.ok)try{speechSynthesis.onvoiceschanged=()=>TTS.load();}catch(e){}
/* --- okrzyki: tekst lektora, język, sylaby dla chóru --- */
const CRY={
  bogurodzica:{syl:'bo/0/.46 gu/2/.46 ro/3/.46 dzi/2/.46 ca/0/.8 dzie/3/.46 wi/5/.46 ca/3/.46 a/2/.5 a/0/1',choir:true,lyric:'♪ Bogurodzica, dziewica… ♪'},
  jezus:{tts:'Jezus Maria!',lang:'pl-PL',syl:'je/0/.16 zus/2/.22 ma/3/.18 ri/2/.14 ja/0/.6'},
  bij:{tts:'Bij! Zabij!',lang:'pl-PL',syl:'bij/2/.3 za/0/.14 bij/3/.6'},
  wiwat:{tts:'Wiwat! Wiwat!',lang:'pl-PL',syl:'wi/0/.18 wat/3/.4 wi/0/.18 waat/5/.8'},
  pal:{tts:'Pal!',lang:'pl-PL',cmd:true},ognia:{tts:'Ognia!',lang:'pl-PL',cmd:true},
  hurra_pl:{tts:'Huraaa!',lang:'pl-PL',syl:'hu/0/.14 rraa/2/1'},
  hurrah_en:{tts:'Hurrah!',lang:'en-US',syl:'hu/0/.14 rraa/2/.9'},
  rebel:{tts:'Yee-haw!',lang:'en-US',syl:'wa/7/.12 hu/12/.16 wa/7/.12 hu/12/.2 ii/14/.5',hi:true},
  fire_en:{tts:'Fire!',lang:'en-US',cmd:true},
  hurra_de:{tts:'Hurra!',lang:'de-DE',syl:'hu/0/.14 rraa/2/.9'},feuer:{tts:'Feuer!',lang:'de-DE',cmd:true},
  gud:{tts:'Gud med oss!',lang:'sv-SE',syl:'gud/0/.26 med/2/.18 oos/3/.6'},fyr:{tts:'Ge fyr!',lang:'sv-SE',cmd:true},
  ura:{tts:'Uraaa!',lang:'ru-RU',syl:'u/0/.2 rraa/3/1'},pali:{tts:'Pali!',lang:'ru-RU',cmd:true},
  allah:{tts:'Allah! Allah!',lang:'tr-TR',syl:'al/0/.14 laah/3/.45 al/0/.14 laah/3/.7'},ates:{tts:'Ateş!',lang:'tr-TR',cmd:true},
  venus:{tts:'Venus Victrix!',lang:'it-IT',syl:'we/0/.2 nus/2/.25 wik/3/.2 triks/2/.6'},
  hercules:{tts:'Hercules Invictus!',lang:'it-IT',syl:'her/0/.2 ku/2/.15 les/3/.25 in/2/.15 wik/3/.2 tus/0/.6'},
  hannibal:{tts:'Hannibal!',lang:'it-IT',syl:'han/0/.2 ni/3/.15 baal/2/.8'},
  gaul:{syl:'a/0/.3 u/5/.2 a/7/.2 u/5/.2 aa/9/.9',hi:true}};
// kto co krzyczy: szarża, zwarcie, rozkaz salwy, zwycięstwo (wg frakcji, z wyjątkami dla jednostek)
const FCRY={
  union:{charge:'hurrah_en',fire:'fire_en',win:'hurrah_en'},confed:{charge:'rebel',fire:'fire_en',win:'rebel'},
  caesar:{charge:'venus',win:'venus'},pompey:{charge:'hercules',win:'hercules'},carth:{charge:'hannibal',win:'hannibal'},gaul:{charge:'gaul',win:'gaul'},
  pl:{charge:'hurra_pl',fire:'ognia',win:'hurra_pl'},de:{charge:'hurra_de',fire:'feuer',win:'hurra_de'},
  rp_k:{charge:'bij',fire:'pal',win:'wiwat'},rp_l:{charge:'bij',fire:'pal',win:'wiwat'},rp_c:{charge:'bij',fire:'pal',win:'wiwat'},
  swe:{charge:'gud',fire:'fyr',win:'gud'},
  mos:{charge:'ura',fire:'pali',win:'ura',unit:{mus:{charge:'gud',fire:'fyr'},pik:{charge:'gud'},rajt:{charge:'gud',fire:'fyr'}}},
  tur:{charge:'allah',fire:'ates',win:'allah'}};
const facId=s=>(VARIANTS[G.variant]||{}).fac?VARIANTS[G.variant].fac[s]:null;
function cryKey(u,ev){const F=FCRY[facId(u.side)];if(!F)return null;const U=F.unit&&F.unit[u.key];return(U&&U[ev])||F[ev]||null;}
const VOXCD={side:[0,0],cmd:[0,0],bog:-99};
function cry(key,x,o={}){const C=CRY[key];if(!C)return;
  if(C.syl)VOX.sing(C.syl,{x,n:o.n||(C.choir?10:7),base:(C.hi?150:115)*(o.pitch||1),shout:!C.choir,soft:C.choir,vol:o.vol||(C.choir?.55:.5),rate:o.rate||1,oct:C.choir,spread:C.choir?22:0});
  if(C.tts)TTS.say(C.tts,C.lang,{pitch:C.hi?1.2:.65,rate:C.cmd?1.1:1,prio:o.prio});}
// zdarzenia
function voxCharge(u){if(G.vox<1||G.state!=='battle')return;const s=u.side;
  if(u.key==='hus'){// husaria: Bogurodzica (najwyżej co 30 s), między nimi „Jezus Maria!” albo „Bij! Zabij!”
    whoosh(u.x);if(G.t-VOXCD.bog>30){VOXCD.bog=G.t;cry('bogurodzica',u.x);msg(s,CRY.bogurodzica.lyric);VOXCD.side[s]=G.t+6;return;}
    if(G.t<VOXCD.side[s])return;VOXCD.side[s]=G.t+4;cry(R()<.5?'jezus':'bij',u.x);return;}
  if(G.t<VOXCD.side[s])return;VOXCD.side[s]=G.t+4;const k=cryKey(u,'charge');if(k)cry(k,u.x);
  if(k==='gaul')carnyx(u.x);if(u.type==='cav'&&R()<.6)VOX.neigh(u.x,.16);}
function voxFire(u){if(G.vox<1||G.state!=='battle'||G.t<VOXCD.cmd[u.side])return;VOXCD.cmd[u.side]=G.t+5+R()*3;const k=cryKey(u,'fire');if(!k)return;
  if(G.vox>=2&&TTS.ok&&TTS.voices.length)cry(k,u.x);else VOX.sing('o/0/.12 aa/2/.3',{x:u.x,n:1,base:140,shout:true,vol:.35});}
function voxMelee(u){if(G.vox<1||G.t<VOXCD.side[u.side]||(u.meleeCryT||0)>G.t)return;u.meleeCryT=G.t+12;VOXCD.side[u.side]=G.t+4;
  const k=u.key==='hus'?(R()<.5?'jezus':'bij'):cryKey(u,'charge');if(k&&CRY[k].syl)cry(k,u.x,{n:5,vol:.42});}
/* --- odgłosy pola --- */
function whoosh(x){if(!AU.ok())return;const c=AU.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2600,t+.8);f.frequency.exponentialRampToValueAtTime(700,t+1.6);
  const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.18,t+.5);g.gain.setTargetAtTime(0,t+1.1,.25);
  let n=g;if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=AU.pan(x);g.connect(p);n=p;}s.connect(f);f.connect(g);n.connect(AU.master);s.start(t,0,1.6);}
function hoof(x,vol){if(!AU.ok())return;AU.burst(.05,170+R()*90,'lowpass',2,vol,AU.pan(x));}
function drum(t,vol,low){if(!AU.ok())return;const c=AU.ctx,at=c.currentTime+t;if(low){AU.tone(58,.35,'sine',vol,t,-20);AU.burst(.2,180,'lowpass',1,vol*.6,0,t);}else{AU.burst(.09,1700,'bandpass',1.2,vol,0,t);AU.tone(190,.06,'triangle',vol*.5,t);}}
function drumRoll(vol=.12){for(let i=0;i<10;i++)drum(i*.07,vol*(.4+i*.06));drum(.8,vol*1.2);drum(1.1,vol);drum(1.25,vol);drum(1.4,vol*1.3);}
// mehter: kös (wielki bęben), nakkare i zurna w skali hidżaz
function mehter(vol=.1){if(!AU.ok())return;const sc=[0,1,4,5,7,8,10,12],mel=[4,5,4,2,1,2,4,1,0,0];let t=0;
  for(let i=0;i<mel.length;i++){const d=i%4===3?.6:.3;AU.tone(293.7*Math.pow(2,sc[mel[i]]/12),d*.95,'square',vol*.45,t,0,2400);if(i%2===0)drum(t,vol*1.6,true);else drum(t,vol*.8);t+=d;}
  for(let i=0;i<4;i++)drum(t+i*.15,vol*(i===3?1.8:1),i===3);}
function carnyx(x){if(!AU.ok())return;const c=AU.ctx,t=c.currentTime,o=c.createOscillator();o.type='sawtooth';const am=c.createOscillator();am.frequency.value=28;const ag=c.createGain();ag.gain.value=6;am.connect(ag);ag.connect(o.frequency);
  o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(140,t+.4);o.frequency.setValueAtTime(140,t+1.3);o.frequency.linearRampToValueAtTime(70,t+2);
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1300;f.Q.value=4;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.2);g.gain.setTargetAtTime(0,t+1.8,.2);
  let n=g;if(c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=AU.pan(x);g.connect(p);n=p;}o.connect(f);f.connect(g);n.connect(AU.master);o.start(t);am.start(t);o.stop(t+2.6);am.stop(t+2.6);}
// pętla dźwięków: szarże, tętent, bębny i mehter w tle
function voxTick(dt){if(G.state!=='battle'||!AU.ok())return;let hooves=0;
  for(const u of units){if(u.dead||u.gone||u.state==='enter')continue;
    const ch=u.state==='ride'||u.furyT>0||u.chargeT>0;if(ch&&!u._ch)voxCharge(u);u._ch=ch;
    if(u.type==='cav'&&hooves<3&&(u.gallop||u.state==='ride'||u.moving||u.men.some(m=>m.alive&&m.mv>.5))){hooves++;u.hoofT=(u.hoofT||0)-dt;
      if(u.hoofT<=0){const fast=u.gallop||u.state==='ride';u.hoofT=(fast?.085:.16)*(.8+R()*.4);hoof(u.x,(fast?.09:.05)*Math.min(1,u.n/3));}}}
  G.ambT=(G.ambT===undefined?6:G.ambT)-dt;
  if(G.ambT<=0&&G.vox>=1){G.ambT=14+R()*12;const f=[facId(0),facId(1)];
    if(f.includes('tur'))mehter(.07);else if(G.era==='acw'||f.includes('swe')||G.era==='pl17')drumRoll(.07);else if(f.includes('gaul')&&R()<.5)carnyx(R()*W);
    else if(G.era==='ww2')AU.burst(1.6,90,'lowpass',.7,.25,(R()-.5)*1.6);}}
/* --- podpięcie pod silnik --- */
const _clVolleyV=clVolley;clVolley=function(u,o){const r=_clVolleyV(u,o);if(r&&!(o&&o.noPowder&&u.key!=='num'))voxFire(u);return r;};
const _killManV=killMan;
killMan=function(e,m,kind,fl){const was=m.alive;_killManV(e,m,kind,fl);if(!was||m.alive||kind==='drown')return;
  if(e.type!=='tank'&&e.type!=='ele'&&R()<.35)VOX.scream(m.x);if(e.type==='cav'&&R()<.25)VOX.neigh(m.x,.12);
  if(kind==='melee'||kind==='trample'){let a=null,bd=60;for(const u of units){if(u.side===e.side||u.dead||u.gone)continue;const d=dist(u.x,u.y,m.x,m.y);if(d<bd){bd=d;a=u;}}if(a)voxMelee(a);}};
const _eraTick3V=eraTick3;eraTick3=function(dt){_eraTick3V(dt);voxTick(dt);};
const _endBattleV=endBattle;endBattle=function(w,reason){_endBattleV(w,reason);if(w<0||G.vox<1)return;const k=cryKey({side:w,key:''},'win');if(k)setTimeout(()=>cry(k,w===0?W*.3:W*.7,{n:10,prio:true}),900);};
const _startBattleV=startBattle;startBattle=function(){_startBattleV();VOXCD.side=[0,0];VOXCD.cmd=[0,0];VOXCD.bog=-99;G.ambT=8;try{if(TTS.ok)speechSynthesis.cancel();}catch(e){}
  if(G.vox<1||G.rules!=='classic')return;const f=[facId(0),facId(1)];
  if(G.era==='pl17'){VOXCD.bog=0;setTimeout(()=>{cry('bogurodzica',W*.25,{n:12,vol:.5});msg(0,CRY.bogurodzica.lyric);},1600);}
  if(f.includes('tur'))setTimeout(()=>mehter(.09),5200);else if(G.era==='acw'||f.includes('swe'))setTimeout(()=>drumRoll(.1),1500);else if(f.includes('gaul'))setTimeout(()=>carnyx(W*.75),2000);};
/* ================= PĘTLA ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{pollInput(dt);
  if(G.loadIdx<MAPS.length&&G.state!=='deploy'&&G.state!=='battle'){prepMap(G.loadIdx++);if(!vignette)initFx();}
  for(const m of G.msgs)m.t+=dt;
  switch(G.state){
    case'title':G.t+=dt;stepTitle();drawTitle();break;
    case'army':G.t+=dt;stepArmy();drawArmy();break;
    case'map':G.t+=dt;stepMap();drawMap();break;
    case'deploy':case'battle':if(G.rules==='classic')clStep(dt);else stepBattle(dt);updParts(dt);G.shake=Math.max(0,G.shake-dt*8);if(G.state==='pause'){drawField();drawHUD();drawPause();break;}drawField();drawHUD();break;
    case'pause':stepPause();drawField();drawHUD();if(G.state==='pause')drawPause();break;
    case'end':G.t+=dt;updParts(dt);stepEnd(dt);drawField();drawHUD();if(G.state==='end')drawEnd();break;}
  }catch(e){ctx=SCR;console.error(e);ctx.fillStyle='#300';ctx.fillRect(0,H-24,W,24);ctx.fillStyle='#fff';ctx.font='14px monospace';ctx.textAlign='left';ctx.fillText('Błąd: '+e.message,8,H-8);}
  requestAnimationFrame(frame);}
let started=false;const go=()=>{if(started)return;started=true;last=performance.now();requestAnimationFrame(frame);};
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load(`40px ${FONT_D}`,'Błękit ąęśćżźńół'),document.fonts.load(`16px ${FONT_T}`,'Zażółć gęślą jaźń ◀▶')]).catch(()=>{}):Promise.resolve()).then(go);
setTimeout(go,2500);
</script>
